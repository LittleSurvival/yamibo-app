name: Release

on:
  workflow_dispatch:

concurrency:
  group: mirror-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  MIRROR_OWNER: LittleSurvival
  MIRROR_REPO: ymb-apk-release
  GITEA_BASE_URL: ${{ vars.GITEA_BASE_URL }}
  GITEA_SSH_HOST: ${{ vars.GITEA_SSH_HOST }}
  GITEA_SSH_PORT: ${{ vars.GITEA_SSH_PORT }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.meta.outputs.version_code }}
      apk_name: ${{ steps.meta.outputs.apk_name }}
      ipa_name: ${{ steps.meta.outputs.ipa_name }}
      release_title: ${{ steps.meta.outputs.release_title }}
      release_url: ${{ steps.meta.outputs.release_url }}
      github_asset_url: ${{ steps.meta.outputs.github_asset_url }}
      changelog: ${{ steps.meta.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Validate update manifest
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("update/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          version_code = str(manifest["versionCode"])
          version_name = str(manifest["versionName"])
          channel = str(manifest.get("channel", "stable"))

          changelog = Path("update/changelogs") / f"{version_code}.changelog"
          if not changelog.exists() or not changelog.read_text(encoding="utf-8").strip():
              raise SystemExit(f"Missing or empty {changelog}")

          apk_name = f"yamibo-{channel}-v{version_name}.apk"
          ipa_name = f"yamibo-{channel}-v{version_name}-unsigned.ipa"
          release_title = f"{channel}-v{version_name}"
          release_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{version_code}"
          github_asset_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{version_code}/{apk_name}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version_code={version_code}\n")
              out.write(f"version_name={version_name}\n")
              out.write(f"channel={channel}\n")
              out.write(f"apk_name={apk_name}\n")
              out.write(f"ipa_name={ipa_name}\n")
              out.write(f"release_title={release_title}\n")
              out.write(f"release_url={release_url}\n")
              out.write(f"github_asset_url={github_asset_url}\n")
              out.write(f"changelog={changelog.as_posix()}\n")
          PY

      - name: Check release tag
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.version_code }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "refs/tags/$TAG")"
            head_commit="$(git rev-parse HEAD)"
            if [ "$tag_commit" != "$head_commit" ]; then
              echo "Release tag $TAG already exists at $tag_commit, but this workflow is running on $head_commit." >&2
              exit 1
            fi
          fi

      - name: Check required release credentials
        shell: bash
        env:
          MINE_KEYSTORE_BASE64: ${{ secrets.MINE_KEYSTORE_BASE64 }}
          MINE_KEY_ALIAS: ${{ secrets.MINE_KEY_ALIAS }}
          MINE_KEYSTORE_PASSWORD: ${{ secrets.MINE_KEYSTORE_PASSWORD }}
          MINE_KEY_PASSWORD: ${{ secrets.MINE_KEY_PASSWORD }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          GITEA_SSH_PRIVATE_KEY: ${{ secrets.GITEA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in MINE_KEYSTORE_BASE64 MINE_KEY_ALIAS MINE_KEYSTORE_PASSWORD MINE_KEY_PASSWORD GITEE_TOKEN GITEA_TOKEN GITEE_SSH_PRIVATE_KEY GITEA_SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "$name is required" >&2
              exit 1
            fi
          done

      - name: Sync and validate stable manifest
        run: ./gradlew syncStableManifest validateUpdateManifest --console=plain

  build_android:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sign.outputs.sha256 }}
      size: ${{ steps.sign.outputs.size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode signing keystore
        shell: bash
        env:
          MINE_KEYSTORE_BASE64: ${{ secrets.MINE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${MINE_KEYSTORE_BASE64:-}" ]; then
            echo "MINE_KEYSTORE_BASE64 is required" >&2
            exit 1
          fi
          echo "$MINE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mine.keystore"

      - name: Build release APK
        run: ./gradlew :composeApp:assembleRelease --console=plain

      - name: Sign APK
        id: sign
        shell: bash
        env:
          MINE_KEY_ALIAS: ${{ secrets.MINE_KEY_ALIAS }}
          MINE_KEYSTORE_PASSWORD: ${{ secrets.MINE_KEYSTORE_PASSWORD }}
          MINE_KEY_PASSWORD: ${{ secrets.MINE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned_apk="$(find composeApp/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$unsigned_apk" ]; then
            echo "No release APK found" >&2
            exit 1
          fi

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aligned_apk="$RUNNER_TEMP/aligned.apk"
          signed_apk="$RUNNER_TEMP/${{ needs.check.outputs.apk_name }}"

          "$build_tools/zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/mine.keystore" \
            --ks-key-alias "$MINE_KEY_ALIAS" \
            --ks-pass "pass:$MINE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$MINE_KEY_PASSWORD" \
            --out "$signed_apk" \
            "$aligned_apk"
          "$build_tools/apksigner" verify "$signed_apk"

          sha256="$(sha256sum "$signed_apk" | awk '{print $1}')"
          size="$(stat -c%s "$signed_apk")"
          echo "apk_path=$signed_apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-apk
          path: ${{ steps.sign.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

  build_ios:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned iPhone Release IPA
        run: bash .github/scripts/release/build-unsigned-ios-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: ${{ runner.temp }}/ios-release/*.ipa
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [check, build_android, build_ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Sync stable manifest for mirror tags
        run: ./gradlew syncStableManifest --console=plain
      - name: Download signed Android APK
        uses: actions/download-artifact@v4
        with:
          name: signed-android-apk
          path: ${{ runner.temp }}/android-release
      - name: Download unsigned iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: ${{ runner.temp }}/ios-release

      - name: Verify release build artifacts
        shell: bash
        env:
          APK_NAME: ${{ needs.check.outputs.apk_name }}
          IPA_NAME: ${{ needs.check.outputs.ipa_name }}
          APK_SHA256: ${{ needs.build_android.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ios-release/$IPA_NAME"
          printf '%s  %s\n' "$APK_SHA256" "$RUNNER_TEMP/android-release/$APK_NAME" | sha256sum --check

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.version_code }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "refs/tags/$tag")"
            head_commit="$(git rev-parse HEAD)"
            if [ "$tag_commit" != "$head_commit" ]; then
              echo "Release tag $tag already exists at $tag_commit, but this workflow is running on $head_commit." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.version_code }}"
          title="${{ needs.check.outputs.release_title }}"
          changelog="${{ needs.check.outputs.changelog }}"
          apk="${{ runner.temp }}/android-release/${{ needs.check.outputs.apk_name }}"
          ipa="$RUNNER_TEMP/ios-release/${{ needs.check.outputs.ipa_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$changelog"
            gh release upload "$tag" "$apk" "$ipa" --clobber
          else
            gh release create "$tag" "$apk" "$ipa" --title "$title" --notes-file "$changelog" --verify-tag
          fi

      - name: Start SSH agent for mirrors
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
            ${{ secrets.GITEA_SSH_PRIVATE_KEY }}

      - name: Trust mirror SSH hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 60 gitee.com >> ~/.ssh/known_hosts
          gitea_host="${GITEA_SSH_HOST:-gitea.com}"
          gitea_port="${GITEA_SSH_PORT:-22}"
          ssh-keyscan -T 60 -p "$gitea_port" "$gitea_host" >> ~/.ssh/known_hosts

      - name: Prepare mirror release tags
        timeout-minutes: 60
        shell: bash
        env:
          GIT_SSH_COMMAND: >-
            ssh -o BatchMode=yes
            -o ConnectTimeout=60
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
        run: |
          set -euo pipefail

          retry_git() {
            local label="$1"
            shift
            local attempt
            for attempt in 1 2 3; do
              if timeout --foreground 30s "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "$label failed (attempt $attempt/3); retrying in $((attempt * 5))s..." >&2
                sleep "$((attempt * 5))"
              fi
            done
            echo "$label failed after 3 attempts" >&2
            return 1
          }

          gitea_remote() {
            local host="${GITEA_SSH_HOST:-gitea.com}"
            local port="${GITEA_SSH_PORT:-22}"
            if [ "$port" = "22" ]; then
              printf 'git@%s:%s/%s.git' "$host" "$MIRROR_OWNER" "$MIRROR_REPO"
            else
              printf 'ssh://git@%s:%s/%s/%s.git' "$host" "$port" "$MIRROR_OWNER" "$MIRROR_REPO"
            fi
          }

          prepare_mirror_tag() {
            local name="$1"
            local remote="$2"
            local feed="$RUNNER_TEMP/mirror-tag-feed-$name/update"
            mkdir -p "$feed"
            cp -R update/. "$feed/"
            bash .github/scripts/release/publish-feed-directory.sh "$remote" main "$feed" update
            local dir="$RUNNER_TEMP/mirror-tag-$name"
            git clone --quiet --depth 1 --single-branch --branch main "$remote" "$dir"
            git -C "$dir" tag -f "${{ needs.check.outputs.version_code }}"
            retry_git "$name tag push" git -C "$dir" push --force origin "refs/tags/${{ needs.check.outputs.version_code }}"
          }

          prepare_mirror_tag "gitee" "git@gitee.com:${MIRROR_OWNER}/${MIRROR_REPO}.git"
          prepare_mirror_tag "gitea" "$(gitea_remote)"

      - name: Publish Gitee release asset
        id: gitee_release
        timeout-minutes: 60
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ needs.check.outputs.version_code }}
          TITLE: ${{ needs.check.outputs.release_title }}
          CHANGELOG: ${{ needs.check.outputs.changelog }}
          APK: ${{ runner.temp }}/android-release/${{ needs.check.outputs.apk_name }}
          APK_NAME: ${{ needs.check.outputs.apk_name }}
          IPA: ${{ runner.temp }}/ios-release/${{ needs.check.outputs.ipa_name }}
          IPA_NAME: ${{ needs.check.outputs.ipa_name }}
        run: |
          set -euo pipefail
          bash .github/scripts/release/publish-gitee-release-asset.sh

      - name: Publish Gitea release asset
        id: gitea_release
        timeout-minutes: 60
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_BASE_URL: ${{ env.GITEA_BASE_URL }}
          TAG: ${{ needs.check.outputs.version_code }}
          TITLE: ${{ needs.check.outputs.release_title }}
          CHANGELOG: ${{ needs.check.outputs.changelog }}
          APK: ${{ runner.temp }}/android-release/${{ needs.check.outputs.apk_name }}
          APK_NAME: ${{ needs.check.outputs.apk_name }}
          IPA: ${{ runner.temp }}/ios-release/${{ needs.check.outputs.ipa_name }}
          IPA_NAME: ${{ needs.check.outputs.ipa_name }}
        run: |
          set -euo pipefail
          bash .github/scripts/release/publish-gitea-release-asset.sh

      - name: Generate published update manifests
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$RUNNER_TEMP/published-update/github/update" \
          RELEASE_URL="${{ needs.check.outputs.release_url }}" \
          ASSET_URL="${{ needs.check.outputs.github_asset_url }}" \
          APK_SHA256="${{ needs.build_android.outputs.sha256 }}" \
          APK_SIZE="${{ needs.build_android.outputs.size }}" \
            python3 .github/scripts/release/write-published-update-manifest.py

          OUTPUT_DIR="$RUNNER_TEMP/published-update/gitee/update" \
          RELEASE_URL="${{ steps.gitee_release.outputs.release_url }}" \
          ASSET_URL="${{ steps.gitee_release.outputs.asset_url }}" \
          APK_SHA256="${{ needs.build_android.outputs.sha256 }}" \
          APK_SIZE="${{ needs.build_android.outputs.size }}" \
            python3 .github/scripts/release/write-published-update-manifest.py

          OUTPUT_DIR="$RUNNER_TEMP/published-update/gitea/update" \
          RELEASE_URL="${{ steps.gitea_release.outputs.release_url }}" \
          ASSET_URL="${{ steps.gitea_release.outputs.asset_url }}" \
          APK_SHA256="${{ needs.build_android.outputs.sha256 }}" \
          APK_SIZE="${{ needs.build_android.outputs.size }}" \
            python3 .github/scripts/release/write-published-update-manifest.py

      - name: Validate published update manifests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew validatePublishedUpdateManifest -PpublishedUpdateDir="$RUNNER_TEMP/published-update/github/update" --console=plain
          ./gradlew validatePublishedUpdateManifest -PpublishedUpdateDir="$RUNNER_TEMP/published-update/gitee/update" --console=plain
          ./gradlew validatePublishedUpdateManifest -PpublishedUpdateDir="$RUNNER_TEMP/published-update/gitea/update" --console=plain

      - name: Push published update folder to GitHub update-release branch
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/release/publish-feed-directory.sh \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            update-release "$RUNNER_TEMP/published-update/github/update" update

      - name: Push update folder to mirror repositories
        timeout-minutes: 60
        shell: bash
        env:
          GIT_SSH_COMMAND: >-
            ssh -o BatchMode=yes
            -o ConnectTimeout=60
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
        run: |
          set -euo pipefail

          retry_git() {
            local label="$1"
            shift
            local attempt
            for attempt in 1 2 3; do
              if timeout --foreground 30s "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "$label failed (attempt $attempt/3); retrying in $((attempt * 5))s..." >&2
                sleep "$((attempt * 5))"
              fi
            done
            echo "$label failed after 3 attempts" >&2
            return 1
          }

          gitea_remote() {
            local host="${GITEA_SSH_HOST:-gitea.com}"
            local port="${GITEA_SSH_PORT:-22}"
            if [ "$port" = "22" ]; then
              printf 'git@%s:%s/%s.git' "$host" "$MIRROR_OWNER" "$MIRROR_REPO"
            else
              printf 'ssh://git@%s:%s/%s/%s.git' "$host" "$port" "$MIRROR_OWNER" "$MIRROR_REPO"
            fi
          }

          push_mirror() {
            local name="$1"
            local remote="$2"
            bash .github/scripts/release/publish-feed-directory.sh \
              "$remote" main "$RUNNER_TEMP/published-update/$name/update" update
            local dir="$RUNNER_TEMP/mirror-release-tag-$name"
            git clone --quiet --depth 1 --single-branch --branch main "$remote" "$dir"
            git -C "$dir" tag -f "${{ needs.check.outputs.version_code }}"
            retry_git "$name tag push" git -C "$dir" push --force origin "refs/tags/${{ needs.check.outputs.version_code }}"
          }

          push_mirror "gitee" "git@gitee.com:${MIRROR_OWNER}/${MIRROR_REPO}.git"
          push_mirror "gitea" "$(gitea_remote)"
