# Branch-only migration adapter. Never merge this workflow into main.
name: Download content Apple validation

on:
  push:
    branches:
      - stable-v0.0.9-fix-downloaded-content-loading-d76edbf-9be0117-validation

permissions:
  contents: read

concurrency:
  group: download-content-framework-first-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apple-validation:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_VALIDATE_OUTPUT: ${{ github.workspace }}/.tmp/qa/apple-validate/results
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: download-native-ui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Run selected validation script
        timeout-minutes: 50
        shell: bash
        env:
          SELECTED_SCRIPT: stable-v0.0.9-fix-downloaded-content-loading-d76edbf-9be0117-validation-01
          CUSTOM_SCRIPT: ''
        run: |
          set -euo pipefail
          script="$SELECTED_SCRIPT"
          if [ "$script" = custom ]; then script="$CUSTOM_SCRIPT"; fi
          if [[ ! "$script" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*-[0-9]{2,}$ ]]; then
            echo 'Expected a script name in <branch-name>-<NN> form, without .sh.' >&2
            exit 2
          fi
          entry=".github/scripts/apple-validate/$script.sh"
          if [ ! -f "$entry" ]; then
            echo "Script not found: $entry. Select the validation ref containing it." >&2
            exit 2
          fi
          mkdir -p "$APPLE_VALIDATE_OUTPUT"
          {
            printf 'Script: %s\nCommit: %s\n' "$script" "$(git rev-parse HEAD)"
            git status --short
            uname -m
            sw_vers
            java -version 2>&1
            xcodebuild -version
            xcrun --sdk iphonesimulator --show-sdk-version
            xcrun simctl list devices available
          } | tee "$APPLE_VALIDATE_OUTPUT/environment.log"
          set +e
          bash "$entry" 2>&1 | tee "$APPLE_VALIDATE_OUTPUT/validation.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$APPLE_VALIDATE_OUTPUT/exit-code.txt"
          exit "$status"
      - name: Export Xcode results and attachments
        if: always()
        shell: bash
        run: |
          if [ -d "$APPLE_VALIDATE_OUTPUT" ]; then
            find "$APPLE_VALIDATE_OUTPUT" -name '*.xcresult' -type d -prune -print0 |
              while IFS= read -r -d '' result; do
                xcrun xcresulttool get test-results summary --path "$result" > "${result%.xcresult}-summary.json"
                xcrun xcresulttool export attachments --path "$result" --output-path "${result%.xcresult}-attachments"
              done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.APPLE_VALIDATE_OUTPUT }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
