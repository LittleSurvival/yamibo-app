name: Download content Apple validation

on:
    push:
        branches:
            - stable-v0.0.9-fix-downloaded-content-loading-d76edbf-9be0117-validation

permissions:
    contents: read

concurrency:
    group: download-content-framework-first-${{ github.ref }}
    cancel-in-progress: true

jobs:
    apple-validation:
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'
            - uses: gradle/actions/setup-gradle@v4
              with:
                  cache-read-only: false
            - uses: actions/cache/restore@v4
              id: konan
              with:
                  path: ~/.konan
                  key: download-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
            - name: Kotlin simulator and device compilation and native regressions
              run: |
                  uname -m
                  xcodebuild -version
                  chmod +x gradlew
                  ./gradlew :composeApp:compileKotlinIosSimulatorArm64 :composeApp:compileKotlinIosArm64 :shared:iosSimulatorArm64Test --console=plain --max-workers=2
            - uses: actions/cache/save@v4
              if: steps.konan.outputs.cache-hit != 'true'
              with:
                  path: ~/.konan
                  key: download-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
            - name: Configure isolated UI test target
              run: |
                  gem install xcodeproj -v 1.27.0 --no-document --user-install
                  ruby .tmp/qa/download-content/ios/configure_tests.rb
                  python3 - <<'PY'
                  import json, os, subprocess
                  data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
                  phones=[d for values in data['devices'].values() for d in values if 'iPhone' in d['name']]
                  assert phones, 'No available iPhone simulator'
                  udid=phones[0]['udid']
                  with open(os.environ['GITHUB_ENV'],'a') as f: f.write('QA_SIMULATOR='+udid+'\n')
                  PY
            - name: Prepare Kotlin framework before booting the simulator
              timeout-minutes: 20
              run: |
                  export SDK_NAME="iphonesimulator$(xcrun --sdk iphonesimulator --show-sdk-version)"
                  export CONFIGURATION=Debug
                  export ARCHS=arm64
                  export BUILT_PRODUCTS_DIR="$PWD/.tmp/qa/ios-derived/Build/Products/Debug-iphonesimulator"
                  export TARGET_BUILD_DIR="$BUILT_PRODUCTS_DIR"
                  export FRAMEWORKS_FOLDER_PATH=yamibo_app.app/Frameworks
                  export UNLOCALIZED_RESOURCES_FOLDER_PATH=yamibo_app.app
                  export ENABLE_USER_SCRIPT_SANDBOXING=NO
                  mkdir -p "$BUILT_PRODUCTS_DIR"
                  sysctl -n hw.memsize
                  ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode --console=plain --max-workers=2
                  ./gradlew --stop
            - name: Build simulator app and UI tests
              timeout-minutes: 10
              run: OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES xcodebuild -project iosApp/iosApp.xcodeproj -scheme DownloadedContentQA -configuration Debug -sdk iphonesimulator -destination "id=$QA_SIMULATOR" -derivedDataPath .tmp/qa/ios-derived CODE_SIGNING_ALLOWED=NO build-for-testing
            - name: Install independent app and seed offline fixtures
              timeout-minutes: 8
              run: |
                  python3 - <<'PY'
                  import os, pathlib, plistlib, subprocess
                  products=pathlib.Path('.tmp/qa/ios-derived/Build/Products/Debug-iphonesimulator')
                  apps=[p for p in products.glob('*.app') if plistlib.loads((p/'Info.plist').read_bytes()).get('CFBundleIdentifier')=='com.yamibo.bbs.downloadqa']
                  assert len(apps)==1, apps
                  device=os.environ['QA_SIMULATOR']
                  subprocess.run(['open','-a','Simulator','--args','-CurrentDeviceUDID',device],check=True,timeout=30)
                  subprocess.run(['xcrun','simctl','boot',device],check=False,timeout=30)
                  subprocess.run(['xcrun','simctl','bootstatus',device,'-b'],check=True,timeout=300)
                  subprocess.run(['xcrun','simctl','install',device,str(apps[0])],check=True)
                  container=pathlib.Path(subprocess.check_output(['xcrun','simctl','get_app_container',device,'com.yamibo.bbs.downloadqa','data'],text=True).strip())
                  fixture=container/'Documents/qa_downloads'
                  subprocess.run(['python3','.tmp/qa/download-content/generate_fixtures.py',str(fixture)],check=True)
                  prefs=container/'Library/Preferences/com.yamibo.bbs.downloadqa.plist'
                  prefs.parent.mkdir(parents=True,exist_ok=True)
                  prefs.write_bytes(plistlib.dumps({'appsettings.backupfolderuri':str(fixture)}))
                  PY
            - name: Run actual reader and management UI flows
              timeout-minutes: 12
              run: xcodebuild -project iosApp/iosApp.xcodeproj -scheme DownloadedContentQA -configuration Debug -destination "id=$QA_SIMULATOR" -derivedDataPath .tmp/qa/ios-derived -resultBundlePath .tmp/qa/download-content/ios-ui.xcresult CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO test-without-building
            - name: Export UI screenshots
              if: always()
              run: |
                  if [ -d .tmp/qa/download-content/ios-ui.xcresult ]; then
                    xcrun xcresulttool export attachments --path .tmp/qa/download-content/ios-ui.xcresult --output-path .tmp/qa/download-content/ios-screenshots
                  fi
            - name: Preserve native results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  include-hidden-files: true
                  name: download-content-ios-results
                  path: |
                      .tmp/qa/download-content/ios-ui.xcresult
                      .tmp/qa/download-content/ios-screenshots
                      shared/build/test-results/iosSimulatorArm64Test
                      shared/build/reports/tests/iosSimulatorArm64Test
