name: iOS retest validation

on:
  push:
    branches:
      - stable-v0.0.9-ios-retest-reliability-31a82bd-f191d1f-validation

permissions:
  contents: read

jobs:
  apple-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Record toolchain
        run: |
          xcodebuild -version
          uname -m
          java -version
          chmod +x gradlew
      - name: Compile Kotlin for simulator and device
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 :composeApp:compileKotlinIosArm64 --console=plain
      - name: Run shared and reader simulator regression tests
        run: ./gradlew :shared:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test --console=plain
      - name: Build Swift host for simulator
        run: xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
