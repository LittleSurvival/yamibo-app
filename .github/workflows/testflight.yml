name: TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed IPA to App Store Connect
        required: true
        type: boolean
        default: true

run-name: TestFlight / ${{ github.ref_name }} / ${{ inputs.upload && 'upload' || 'sign-only' }}

concurrency:
  group: testflight-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4

      - name: Check TestFlight credentials
        env:
          TESTFLIGHT_UPLOAD: ${{ inputs.upload && '1' || '0' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APP_STORE_CONNECT_PROFILE_BASE64: ${{ secrets.APP_STORE_CONNECT_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          required="APPLE_TEAM_ID APPLE_DISTRIBUTION_P12_BASE64 APPLE_DISTRIBUTION_P12_PASSWORD APP_STORE_CONNECT_PROFILE_BASE64"
          if [ "$TESTFLIGHT_UPLOAD" = 1 ]; then
            required="$required APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY"
          fi
          for name in $required; do
            if [ -z "${!name}" ]; then
              echo "$name is required" >&2
              exit 1
            fi
          done

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Identify Xcode cache inputs
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: testflight-konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Validate update manifest
        run: |
          chmod +x gradlew
          ./gradlew syncStableManifest validateUpdateManifest --console=plain

      - name: Archive, sign, and upload
        env:
          TESTFLIGHT_UPLOAD: ${{ inputs.upload && '1' || '0' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APP_STORE_CONNECT_PROFILE_BASE64: ${{ secrets.APP_STORE_CONNECT_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bash .github/scripts/release/upload-testflight.sh

      - name: Upload signed IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-ipa
          path: ${{ runner.temp }}/testflight/yamibo-*.ipa
          if-no-files-found: ignore
          retention-days: 7
