name: Apple validation
run-name: Apple validation / ${{ inputs.validation_script == 'custom' && inputs.custom_script || inputs.validation_script }} / ${{ inputs.validation_ref }}

on:
  workflow_dispatch:
    inputs:
      validation_ref:
        description: Branch, tag or commit containing the code and validation script
        required: true
        type: string
      validation_script:
        description: Validation script (branch name + sequence number)
        required: true
        default: stable-v0.0.9-fix-downloaded-content-loading-d76edbf-9be0117-validation-01
        type: choice
        options:
          - stable-v0.0.9-fix-downloaded-content-loading-d76edbf-9be0117-validation-01
          - custom
      custom_script:
        description: Script filename without .sh when validation_script is custom
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apple-validation-${{ inputs.validation_ref }}-${{ inputs.validation_script }}-${{ inputs.custom_script }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_VALIDATE_OUTPUT: ${{ github.workspace }}/.tmp/qa/apple-validate/results
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validation_ref }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Identify Xcode cache inputs
        id: toolchain
        shell: bash
        run: echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: apple-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Run selected validation script
        timeout-minutes: 50
        shell: bash
        env:
          SELECTED_SCRIPT: ${{ inputs.validation_script }}
          CUSTOM_SCRIPT: ${{ inputs.custom_script }}
        run: |
          set -euo pipefail
          script="$SELECTED_SCRIPT"
          if [ "$script" = custom ]; then script="$CUSTOM_SCRIPT"; fi
          if [[ ! "$script" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*-[0-9]{2,}$ ]]; then
            echo 'Expected a script name in <branch-name>-<NN> form, without .sh.' >&2
            exit 2
          fi
          entry=".github/scripts/apple-validate/$script.sh"
          if [ ! -f "$entry" ]; then
            echo "Script not found: $entry. Select the validation ref containing it." >&2
            exit 2
          fi
          mkdir -p "$APPLE_VALIDATE_OUTPUT"
          {
            printf 'Script: %s\nCommit: %s\n' "$script" "$(git rev-parse HEAD)"
            git status --short
            uname -m
            sw_vers
            java -version 2>&1
            xcodebuild -version
            xcrun --sdk iphonesimulator --show-sdk-version
            xcrun simctl list devices available
          } | tee "$APPLE_VALIDATE_OUTPUT/environment.log"
          set +e
          bash "$entry" 2>&1 | tee "$APPLE_VALIDATE_OUTPUT/validation.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$APPLE_VALIDATE_OUTPUT/exit-code.txt"
          exit "$status"
      - name: Export Xcode results and attachments
        if: always()
        shell: bash
        run: |
          if [ -d "$APPLE_VALIDATE_OUTPUT" ]; then
            find "$APPLE_VALIDATE_OUTPUT" -name '*.xcresult' -type d -prune -print0 |
              while IFS= read -r -d '' result; do
                xcrun xcresulttool get test-results summary --path "$result" > "${result%.xcresult}-summary.json"
                xcrun xcresulttool export attachments --path "$result" --output-path "${result%.xcresult}-attachments"
              done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.APPLE_VALIDATE_OUTPUT }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
